[project]
name = "ghostfirst-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents check a link with GhostFirst before following it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "mcp==2.2.0",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ghostfirst-mcp = "ghostfirst_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostfirst_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
