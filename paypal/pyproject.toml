[project]
name = "ghost-checkout"
version = "0.1.0"
description = "Offline payee-binding demo for Ghost Checkout"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["mcp==2.2.0", "httpx>=0.28,<1", "paypal-server-sdk==2.0.0", "uvicorn>=0.30,<1", "playwright>=1.50,<2"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
ghost-checkout-mcp = "ghost_checkout.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ghost_checkout"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
